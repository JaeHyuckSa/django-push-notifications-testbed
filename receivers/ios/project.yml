# XcodeGen spec for the receiver app. Generate the Xcode project with
#   DPN_TEAM_ID=<Team ID> DPN_BUNDLE_ID=<bundle ID> xcodegen --spec receivers/ios/project.yml
name: DPNTestbed
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  DPNTestbed:
    type: application
    platform: iOS
    sources:
      - DPNTestbedApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${DPN_BUNDLE_ID}
        DEVELOPMENT_TEAM: ${DPN_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: build/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: build/DPNTestbed.entitlements
      properties:
        aps-environment: development
